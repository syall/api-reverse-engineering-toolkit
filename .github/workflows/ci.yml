name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 23, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test (verify_endpoints.ts internals)
        run: node --experimental-strip-types --test tests/*.test.ts

      - name: Validate example fixtures file is well-formed
        run: node -e "JSON.parse(require('node:fs').readFileSync('examples/fixtures.example.json', 'utf-8'))"

      - name: CLI smoke test (expected to fail cleanly against an unreachable host)
        run: |
          node --experimental-strip-types scripts/verify_endpoints.ts examples/fixtures.example.json --base-url=http://127.0.0.1:1 || true
